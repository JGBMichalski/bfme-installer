line-length = 120
# The tests run on Ubuntu 24.04's Python; the Flatpak's is newer.
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # the formatter keeps code within the line length; long comments and text are left as they are
    "SIM105",  # try/except/pass reads plainer than contextlib.suppress
    "SIM117",  # nested `with` shows which block a context belongs to
    "SIM108",  # a plain if/else reads better than a long conditional expression
]

[lint.per-file-ignores]
# GTK modules call gi.require_version() before importing from gi.repository.
"bfme_wizard/control/apps.py" = ["E402"]
"bfme_wizard/ui/**/*.py" = ["E402"]
